[project]
name = "pitch-creator"
version = "0.1.0"
description = "Internal pitch creation tool"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "greenlet",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "pyjwt",
    "pwdlib[argon2]",
    "celery[redis]",
    "asyncer",
    "email-validator",
    "pgvector",
    "python-pptx",
    "pypdf",
    "python-docx",
    "langchain",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "fastembed",
    "watchfiles",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "FAST"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.uv]
package = true
